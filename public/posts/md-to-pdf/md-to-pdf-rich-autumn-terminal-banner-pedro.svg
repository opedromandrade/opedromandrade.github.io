<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0c0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rectangle -->
  <rect width="1200" height="400" fill="url(#gradient)" rx="20" />
  
  <!-- Terminal-like border -->
  <rect x="20" y="20" width="1160" height="360" fill="none" stroke="#d18c52" stroke-width="2" rx="10" />
  
  <!-- Terminal header -->
  <rect x="30" y="30" width="1140" height="30" fill="#e6b885" rx="5" />
  <text x="40" y="50" font-family="'Courier New', monospace" font-size="14" fill="#8a4a2a">
    pedro@hugo-blog:~$ 
  </text>
  
  <!-- Main text -->
  <text x="600" y="180" font-family="'Courier New', monospace" font-size="48" font-weight="600" text-anchor="middle" fill="#8a4a2a">
    Md to Pdf
  </text>
  
  <text x="600" y="240" font-family="'Courier New', monospace" font-size="24" font-weight="400" text-anchor="middle" fill="#a36b3a">
    Converting simple Markdown to Styled PDF
  </text>
  
  <!-- Terminal-like cursor -->
  <rect x="580" y="270" width="10" height="20" fill="#d18c52" rx="2" />
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="10" fill="#ff9c66" opacity="0.7" />
  <circle cx="1100" cy="100" r="10" fill="#ffb347" opacity="0.7" />
  <circle cx="100" cy="300" r="10" fill="#ffb347" opacity="0.7" />
  <circle cx="1100" cy="300" r="10" fill="#ff9c66" opacity="0.7" />
</svg>