<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F0E3"/>
      <stop offset="1" stop-color="#EFE5D2"/>
    </linearGradient>
    <linearGradient id="docBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBF7EE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8A5A33" flood-opacity="0.18"/>
    </filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#8A5A33" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="500" fill="url(#bg)"/>

  <!-- decorative flat corner shapes, purely geometric -->
  <rect x="0" y="0" width="1200" height="8" fill="#C05E1E"/>
  <circle cx="1120" cy="70" r="46" fill="#D97E3F" opacity="0.25"/>
  <circle cx="80" cy="430" r="60" fill="#8F9A5B" opacity="0.18"/>

  <!-- title -->
  <text x="600" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#6B4226" font-weight="bold">Rewriting a CV with Markdown, CSS &amp; Pandoc</text>

  <!-- ===== STAGE 1: raw markdown doc ===== -->
  <g filter="url(#soft)">
    <rect x="90" y="130" width="170" height="230" rx="10" fill="url(#docBody)"/>
  </g>
  <rect x="90" y="130" width="170" height="34" rx="10" fill="#D97E3F"/>
  <rect x="90" y="152" width="170" height="12" fill="#D97E3F"/>
  <text x="175" y="153" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#FBF3E6" font-weight="bold">cv.md</text>
  <!-- markdown symbols -->
  <text x="108" y="196" font-family="Consolas, monospace" font-size="22" fill="#C05E1E" font-weight="bold"># Title</text>
  <rect x="108" y="208" width="130" height="6" rx="3" fill="#C9BBA4"/>
  <rect x="108" y="222" width="108" height="6" rx="3" fill="#C9BBA4"/>
  <text x="108" y="262" font-family="Consolas, monospace" font-size="18" fill="#8F9A5B" font-weight="bold">## Role</text>
  <rect x="108" y="272" width="120" height="6" rx="3" fill="#C9BBA4"/>
  <rect x="108" y="286" width="94" height="6" rx="3" fill="#C9BBA4"/>
  <text x="108" y="326" font-family="Consolas, monospace" font-size="16" fill="#B0653A">* skill list *</text>
  <rect x="108" y="338" width="140" height="6" rx="3" fill="#C9BBA4"/>
  <rect x="108" y="352" width="86" height="6" rx="3" fill="#C9BBA4"/>

  <!-- arrow 1 -->
  <g stroke="#B0653A" stroke-width="4" fill="none">
    <line x1="272" y1="245" x2="322" y2="245"/>
    <path d="M322 245 L306 235 L306 255 Z" fill="#B0653A" stroke="none"/>
  </g>

  <!-- ===== STAGE 2: CSS styling ===== -->
  <g filter="url(#soft)">
    <rect x="332" y="160" width="150" height="170" rx="12" fill="#3E2F23"/>
  </g>
  <rect x="332" y="160" width="150" height="30" rx="12" fill="#2B2018"/>
  <text x="407" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#E8C9A0">style.css</text>
  <!-- swatches -->
  <rect x="350" y="206" width="30" height="30" rx="6" fill="#C05E1E"/>
  <rect x="390" y="206" width="30" height="30" rx="6" fill="#D97E3F"/>
  <rect x="350" y="246" width="30" height="30" rx="6" fill="#8F9A5B"/>
  <rect x="390" y="246" width="30" height="30" rx="6" fill="#A47148"/>
  <!-- css lines -->
  <rect x="350" y="290" width="112" height="6" rx="3" fill="#5C4A38"/>
  <rect x="350" y="304" width="86" height="6" rx="3" fill="#5C4A38"/>

  <!-- arrow 2 -->
  <g stroke="#B0653A" stroke-width="4" fill="none">
    <line x1="494" y1="245" x2="544" y2="245"/>
    <path d="M544 245 L528 235 L528 255 Z" fill="#B0653A" stroke="none"/>
  </g>

  <!-- ===== STAGE 3: pandoc terminal ===== -->
  <g filter="url(#soft)">
    <rect x="554" y="175" width="230" height="140" rx="12" fill="#2B2018"/>
  </g>
  <rect x="554" y="175" width="230" height="30" rx="12" fill="#1C150F"/>
  <circle cx="574" cy="190" r="5" fill="#C05E1E"/>
  <circle cx="592" cy="190" r="5" fill="#D97E3F"/>
  <circle cx="610" cy="190" r="5" fill="#8F9A5B"/>
  <text x="572" y="228" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#E8DFCB">$ pandoc cv.md \</text>
  <text x="590" y="252" font-family="Consolas, monospace" font-size="15" fill="#E8DFCB">--css style.css \</text>
  <text x="590" y="276" font-family="Consolas, monospace" font-size="15" fill="#E8DFCB">-o cv.pdf</text>
  <rect x="572" y="288" width="9" height="16" fill="#D97E3F"/>

  <!-- arrow 3 -->
  <g stroke="#B0653A" stroke-width="4" fill="none">
    <line x1="796" y1="245" x2="846" y2="245"/>
    <path d="M846 245 L830 235 L830 255 Z" fill="#B0653A" stroke="none"/>
  </g>

  <!-- ===== STAGE 4: polished resume ===== -->
  <g filter="url(#soft)">
    <rect x="856" y="115" width="250" height="280" rx="10" fill="url(#docBody)"/>
  </g>
  <!-- photo circle -->
  <circle cx="916" cy="165" r="26" fill="#D97E3F"/>
  <circle cx="916" cy="158" r="9" fill="#FBF3E6"/>
  <path d="M898 175 a18 12 0 0 1 36 0 v6 h-36 z" fill="#FBF3E6"/>
  <!-- name and title -->
  <rect x="952" y="148" width="130" height="12" rx="6" fill="#6B4226"/>
  <rect x="952" y="170" width="90" height="8" rx="4" fill="#B0653A"/>
  <!-- divider -->
  <rect x="876" y="208" width="210" height="3" rx="1.5" fill="#C05E1E"/>
  <!-- sections with colored markers -->
  <rect x="876" y="228" width="10" height="10" rx="2" fill="#C05E1E"/>
  <rect x="894" y="229" width="70" height="8" rx="4" fill="#6B4226"/>
  <rect x="894" y="247" width="180" height="6" rx="3" fill="#C9BBA4"/>
  <rect x="894" y="261" width="150" height="6" rx="3" fill="#C9BBA4"/>

  <rect x="876" y="288" width="10" height="10" rx="2" fill="#8F9A5B"/>
  <rect x="894" y="289" width="70" height="8" rx="4" fill="#6B4226"/>
  <rect x="894" y="307" width="180" height="6" rx="3" fill="#C9BBA4"/>
  <rect x="894" y="321" width="130" height="6" rx="3" fill="#C9BBA4"/>

  <rect x="876" y="348" width="10" height="10" rx="2" fill="#D97E3F"/>
  <rect x="894" y="349" width="70" height="8" rx="4" fill="#6B4226"/>
  <rect x="894" y="367" width="180" height="6" rx="3" fill="#C9BBA4"/>

  <!-- footer note -->
  <text x="600" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#8A6A4F" font-style="italic">write it — style it — export everywhere</text>
</svg>